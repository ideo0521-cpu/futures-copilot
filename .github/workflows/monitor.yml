name: futures-monitor
on:
  schedule:
    - cron: "*/5 * * * *"      # 每 5 分鐘（GitHub 尖峰時可能晚幾分鐘）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 盯盤＋更新網頁
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          TOTAL_RISK_PCT: ${{ vars.TOTAL_RISK_PCT }}
        run: python monitor.py
      - name: 存檔
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json docs/index.html
          git diff --cached --quiet || (git commit -q -m "update $(date -u +%FT%TZ)" && git push -q)

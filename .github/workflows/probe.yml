name: research
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt scipy && python tools/stats_build.py
      - run: |
          git config user.name "monitor-bot"; git config user.email "monitor-bot@users.noreply.github.com"
          git add stats.json && git commit -qm "歷史統計 stats.json" && git pull -q --rebase origin main && git push -q
